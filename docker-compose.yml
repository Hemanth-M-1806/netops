services:
  mysql:
    image: mysql:8.0
    container_name: netops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-netops}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netops}
      MYSQL_USER: ${MYSQL_USER:-netops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-netops}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/seed_topology.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "netops", "-pnetops"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
