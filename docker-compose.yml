services:
  mysql:
    image: mysql:8.0
    container_name: netops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-netops}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netops}
      MYSQL_USER: ${MYSQL_USER:-netops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-netops}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/seed_topology.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "netops", "-pnetops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netops-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-netops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-netops}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netops}
      FRONTEND_ORIGIN: http://localhost:3000
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: netops-collector
    restart: unless-stopped
    environment:
      COLLECTOR_FORWARDER: backend
      COLLECTOR_BACKEND_URL: http://backend:8000/api/v1/telemetry/ingest
    ports:
      - "8100:8100"
    depends_on:
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: netops-simulator
    restart: unless-stopped
    environment:
      SIMULATOR_API_BASE_URL: http://backend:8000/api/v1
      SIMULATOR_COLLECTOR_URL: http://collector:8100/ingest
      SIMULATOR_INTERVAL_SECONDS: 5
      SIMULATOR_DEFAULT_SCENARIO: mixed
    depends_on:
      - collector
      - backend

volumes:
  mysql_data:
