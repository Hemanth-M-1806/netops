services:
  mysql:
    image: mysql:8.0
    container_name: netops-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-netops}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netops}
      MYSQL_USER: ${MYSQL_USER:-netops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-netops}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seeds/seed_topology.sql:/docker-entrypoint-initdb.d/02-seeds.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "netops", "-pnetops"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: netops-backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-netops}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-netops}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-netops}
      FRONTEND_ORIGIN: http://localhost:3000
    env_file:
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  collector:
    build:
      context: ./collector
      dockerfile: Dockerfile
    container_name: netops-collector
    restart: unless-stopped
    environment:
      COLLECTOR_FORWARDER: backend
      # NOTE: the collector setting is COLLECTOR_FORWARD_URL (COLLECTOR_ prefix +
      # forward_url field). Any other name is silently ignored by pydantic-settings.
      COLLECTOR_FORWARD_URL: http://backend:8000/api/v1/telemetry/ingest
    ports:
      - "8100:8100"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8100/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: netops-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

  simulator:
    build:
      context: ./simulator
      dockerfile: Dockerfile
    container_name: netops-simulator
    restart: unless-stopped
    environment:
      SIMULATOR_API_BASE_URL: http://backend:8000/api/v1
      SIMULATOR_COLLECTOR_URL: http://collector:8100/ingest
      SIMULATOR_INTERVAL_SECONDS: 5
      SIMULATOR_DEFAULT_SCENARIO: mixed
      SIMULATOR_HOST: 0.0.0.0
      SIMULATOR_PORT: 8200
    ports:
      - "8200:8200"
    depends_on:
      backend:
        condition: service_healthy
      collector:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8200/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  mysql_data:
